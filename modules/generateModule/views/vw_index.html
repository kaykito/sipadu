<div class="flex-grow-1 container-p-y container-fluid">
  <% if (typeof error_msg !== 'undefined' && error_msg) { %>
  <div class="alert alert-danger alert-dismissible" role="alert">
    <%= error_msg %>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  <% } %>
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h4>Generate Module</h4>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="tableSelect" class="form-label">Pilih Tabel Database</label>
                                <select class="form-select" id="tableSelect">
                                    <option value="">Pilih tabel...</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="moduleName" class="form-label">Nama Module</label>
                                <input type="text" class="form-control" id="moduleName" placeholder="Masukkan nama module">
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="generateModule()">Generate Module</button>
                        <button class="btn btn-secondary" onclick="previewStructure()">Preview Structure</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card" id="resultCard" style="display: none;">
                    <div class="card-header">
                        <h5>Generated Module Structure</h5>
                    </div>
                    <div class="card-body">
                        <div id="resultContent"></div>
                        <div class="mt-3">
                            <button class="btn btn-success" onclick="downloadFiles()">Download Files</button>
                            <button class="btn btn-info" onclick="copyToClipboard()">Copy Code</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        
        <!-- Preview Modal -->
        <div class="modal fade" id="previewModal" tabindex="-1" data-bs-backdrop="static">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Module Preview</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <ul class="nav nav-tabs" id="previewTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="controller-tab" data-bs-toggle="tab" data-bs-target="#controller" type="button" role="tab">Controller</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="view-tab" data-bs-toggle="tab" data-bs-target="#view" type="button" role="tab">View</button>
                            </li>
                        </ul>
                        <div class="tab-content mt-3" id="previewTabsContent">
                            <div class="tab-pane fade show active" id="controller" role="tabpanel">
                                <pre><code id="controllerCode"></code></pre>
                            </div>
                            <div class="tab-pane fade" id="view" role="tabpanel">
                                <pre><code id="viewCode"></code></pre>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>

    <script>
        let generatedData = null;

        $(document).ready(function() {
            loadTables();
        });

        function loadTables() {
            $.get('/generateModule/data')
                .done(function(response) {
                    const tables = response.data;
                    const select = $('#tableSelect');
                    select.empty();
                    select.append('<option value="">Pilih tabel...</option>');

                    tables.forEach(table => {
                        select.append(`<option value="${table.TABLE_NAME}">${table.TABLE_NAME}</option>`);
                    });
                })
                .fail(function() {
                    alert('Error loading tables');
                });
        }

        function generateModule() {
            const tableName = $('#tableSelect').val();
            const moduleName = $('#moduleName').val();

            if (!tableName || !moduleName) {
                alert('Pilih tabel dan masukkan nama module terlebih dahulu');
                return;
            }

            $.post('/generateModule/buildModule', {
                tableName: tableName,
                moduleName: moduleName
            })
            .done(function(response) {
                if (response.success) {
                    generatedData = response.data;
                    displayResult(response.data);
                    $('#resultCard').show();
                } else {
                    alert('Error: ' + response.message);
                }
            })
            .fail(function() {
                alert('Error generating module');
            });
        }

        function previewStructure() {
            const tableName = $('#tableSelect').val();
            const moduleName = $('#moduleName').val();

            if (!tableName || !moduleName) {
                alert('Pilih tabel dan masukkan nama module terlebih dahulu');
                return;
            }

            generateModule(); // Generate first, then show preview
            setTimeout(() => {
                if (generatedData) {
                    showPreview(generatedData);
                }
            }, 500);
        }

        function displayResult(data) {
            const content = `
                <div class="alert alert-success">
                    <h6>âœ… Module "${data.moduleName}" berhasil digenerate dan disimpan!</h6>
                    <p><strong>Tabel:</strong> ${data.tableName}</p>
                    <p><strong>Primary Key:</strong> ${data.primaryKey}</p>
                    <p><strong>Jumlah Kolom:</strong> ${data.columns.length}</p>
                    <p><strong>Lokasi File:</strong></p>
                    <ul>
                        <li><code>modules/${data.moduleName}/controllers/${data.moduleName}.js</code></li>
                        <li><code>modules/${data.moduleName}/views/vw_data.html</code></li>
                    </ul>
                    <p><strong>Route:</strong> <code>${data.routeInfo}</code></p>
                </div>
                <div class="mt-3">
                    <a href="/${data.moduleName}/index" class="btn btn-success" target="_blank">ðŸ”— Akses Module Baru</a>
                    <button class="btn btn-info" onclick="previewStructure()">ðŸ‘ï¸ Preview Code</button>
                </div>
            `;
            $('#resultContent').html(content);
        }

        function showPreview(data) {
            $('#controllerCode').text(data.controllerCode);
            $('#viewCode').text(data.viewCode);
            $('#previewModal').modal('show');
        }

        function downloadFiles() {
            if (!generatedData) {
                alert('Generate module terlebih dahulu');
                return;
            }

            // Create controller file
            const controllerBlob = new Blob([generatedData.controllerCode], { type: 'text/javascript' });
            const controllerUrl = URL.createObjectURL(controllerBlob);
            const controllerLink = document.createElement('a');
            controllerLink.href = controllerUrl;
            controllerLink.download = `${generatedData.moduleName}.js`;
            controllerLink.click();

            // Create view file
            const viewBlob = new Blob([generatedData.viewCode], { type: 'text/html' });
            const viewUrl = URL.createObjectURL(viewBlob);
            const viewLink = document.createElement('a');
            viewLink.href = viewUrl;
            viewLink.download = `vw_data.html`;
            viewLink.click();

            URL.revokeObjectURL(controllerUrl);
            URL.revokeObjectURL(viewUrl);
        }

        function copyToClipboard() {
            if (!generatedData) {
                alert('Generate module terlebih dahulu');
                return;
            }

            const text = `Controller Code:\n${generatedData.controllerCode}\n\nView Code:\n${generatedData.viewCode}`;
            navigator.clipboard.writeText(text).then(() => {
                alert('Code berhasil disalin ke clipboard');
            });
        }
    </script>
</body>
</html>
